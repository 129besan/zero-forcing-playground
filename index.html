<header><a href="./" class="brand"><span class="brandmark">●—○</span> ZERO FORCING LAB</a><a href="https://github.com/129besan/zero-forcing-playground" target="_blank" rel="noopener">ソースコード ↗</a></header>
<main><section class="intro"><p class="eyebrow">触ってわかるグラフ理論</p><h1>色が広がる。<br><span>仕組みが見える。</span></h1><p>どこを青くすれば、すべての頂点に色が届く？<br>まずは2つの頂点を選んで、小さな数学の実験を。</p></section>
<nav aria-label="体験を選ぶ"><button data-mode="force" class="active">01 色を広げる</button><button data-mode="fort">02 Fortを探す</button><button data-mode="product">03 選び方を掛ける</button></nav>
